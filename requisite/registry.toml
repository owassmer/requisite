# ---------------------------------------------------------------- diagnoses (spec §2.1), routed by a table

[[item]]
id = "DX.base"
source = "spec §2.1; spec §13 WP4 (Tier 0 for provider, paraphrase and split); addendum §2.4"
says = "An unstable question gets one primary diagnosis with its prescribed action, all probe evidence retained: from the base run's paraphrase-versus-provider split, imprecise_target (disagreement concentrates across paraphrases and each paraphrase is stable across judges; agent refines the target and answer meanings) or contested (paraphrases agree, providers disagree; human review, held not_established); from the split probe, compound (stable sub-questions whose code composition reproduces the parent's intent; replaced with sub-questions plus a composition node); otherwise unexplained (human review, saved as a fixture)."
tier = 0

[[item]]
id = "DX.evidence_state"
source = "spec §2.1; spec §13 WP4 (Tier 1 for evidence and state probes)"
says = "The evidence probe (adding the next-ranked evidence lifts stability over threshold: evidence_gap, agent fetches) and the state probe (disagreement tracks facts moving between observed and assumed: incoherent_state, fix the state construction). After the base run, the probes follow in the order evidence, split, state; unexplained only where none of them fires."
tier = 1

# ---------------------------------------------------------------- post-mortem classes (spec §11, amended by A10)

[[item]]
id = "PM.table"
source = "spec §11 step 3; addendum A10 §11.1"
says = "Each residual gets a primary class among question_definition_error, evidence_missing, evidence_wrong, interpretation_error, dependency_error, consequence_error, contract_compilation_error, rendering_error, execution_error (defects), accepted_basis_risk, accepted_exclusion, ordinary_uncertainty, external_change (not defects), with contributing component defects allowed beside it."
tier = 1

