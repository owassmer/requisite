# What the sources enumerate, each item covered by exactly one test (tests/test_registry.py).
#
# The sources list things the runtime must hold: the invariants (spec §3), the gates (spec §2.4), the diagnoses (spec
# §2.1), the post-mortem classes (spec §11), each work package's acceptance tests (spec §13), the addendum's amended and
# new acceptance tests (addendum §13), and the oracle's verified checks (spec/verify_math.py). What is built is chosen by
# these lists, not by the code's keys: a test declares the items it is the one test for with
# @pytest.mark.covers("<id>", ...), and the registry test fails on a covered id the registry lacks, on an item covered
# twice, and on a covered item marked replaced. An item no test covers yet is open; `requisite registry` prints the board
# by tier, never-cut items first. One test may cover several items where one check proves them together (a truth table).
#
# Fields: id; source (where the sources say it); says (what must hold, in the source's terms); tier (spec §0: 0 required
# for the demo, 1 after Tier 0 is green; a work package's own tier in spec §13 decides); never_cut (spec §13: "Never
# cut: invariants I1–I10, the three-valued evaluator, the rendering check or the diff", and nothing beyond it); replaced_by (an accepted amendment
# replaced it: build to the replacement, never to this; Owen accepted the addendum on November 1).

# ---------------------------------------------------------------- invariants (spec §3; each has an acceptance test in §13)

[[item]]
id = "I1"
source = "spec §3; WP1"
says = "Single write path: agents create Proposals only; a Proposal becomes active only after its required gates pass (schema, tests, stability, relevance, human, as applicable to its kind). Only submit_proposal changes case state."
tier = 0
never_cut = true

[[item]]
id = "I2"
source = "spec §3; WP1"
says = "Immutable evidence: artifacts are content-addressed and never overwritten; overwriting an artifact raises; a changed source is a new version linked to its predecessor."
tier = 0
never_cut = true

[[item]]
id = "I3"
source = "spec §3; WP2"
says = "Time discipline: every judgment state carries as_of; observed claims come only from artifacts with published_at <= as_of and observed_at <= the evaluation time; a later-published artifact is excluded by as_of."
tier = 0
never_cut = true

[[item]]
id = "I4"
source = "spec §3; WP2; spec §14"
says = "Synthetic quarantine: synthetic artifacts live in a separate namespace and can never be referenced as observed claims in a non-synthetic case; a synthetic claim in observed fails type checking."
tier = 0
never_cut = true

[[item]]
id = "I5"
source = "spec §3; spec §6.1; WP3"
says = "Hypotheticals are labeled: anything not established by evidence enters a judgment only through assumed, rendered in its own labeled section; the renderer separates observed from assumed."
tier = 0
never_cut = true

[[item]]
id = "I6"
source = "spec §3; spec §6.3; WP8"
says = "Unknown stays unknown: not_established and contested map to Kleene unknown and propagate by three-valued logic, never coerced to false; the Kleene truth tables pass."
tier = 0
never_cut = true

[[item]]
id = "I7"
source = "spec §3; WP6"
says = "Code owns consequences: dates, thresholds, payoffs, cash flows, aggregation and optimization are computed by registered nodes; a static check forbids provider calls inside nodes."
tier = 0
never_cut = true

[[item]]
id = "I8"
source = "spec §3; spec §8.4; WP8"
says = "One settlement function: the same IR evaluator computes payoffs in construction, example outcomes in drafting, ground truth in fuzzing and settlement at resolution; example outcomes equal evaluator outcomes."
tier = 0
never_cut = true

[[item]]
id = "I9"
source = "spec §3; spec §6.5; WP10; addendum A04"
says = "Price is not probability: quotes are stored as prices (bid, ask, last, size, timestamp); an implied probability is a derived node with an explicit risk-premium assumption; quotes enter the optimizer as prices."
tier = 0
never_cut = true

[[item]]
id = "I10"
source = "spec §3; WP3; addendum §11.3"
says = "Version pinning: every judgment records provider, model id and known training cutoff (unknown recorded as unknown)."
tier = 0
never_cut = true

[[item]]
id = "I10.contamination"
source = "spec §3; WP13"
says = "Forecast evaluations exclude events that resolved before the judging model's training cutoff; an unknown cutoff is recorded as unknown, not as clean (addendum §11.3)."
tier = 0
never_cut = true

